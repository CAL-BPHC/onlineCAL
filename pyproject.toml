[project]
name = "onlineCAL"
version = "0.1.0"
description = "An online portal to manage CIF BPHC's instrument booking process"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "django>=4.2.0,<5",
    "django-filter~=2.4.0",
    "django-admin-rangefilter~=0.6.3",
    "python-dotenv~=0.15.0",
    "django-crispy-forms~=1.11.0",
    "django-q>=1.3.9,<2",
    "mysqlclient>=2.1.0,<3",
    "setuptools>=69.0.3,<70",
    "gunicorn>=23.0.0,<24",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
]

[tool.ruff.lint]
# RUF012 flags Django's `fields`, `widgets`, `labels` and friends on Meta
# classes, which are the framework's idiom rather than a mutable-default bug.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# 0012 combines "now" with a time only to take the time back out and parses
# a duration string with strptime, so the timezone rules do not apply there.
"**/migrations/*" = ["DTZ"]
# The Django project package predates the naming rule.
"server/onlineCAL/__init__.py" = ["N999"]
"__init__.py" = ["F401", "F403", "F405"]
"server/booking_portal/config.py" = ["F403", "F405"]
